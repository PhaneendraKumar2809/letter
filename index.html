<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Happy Birthday Samvarsha — a beautiful, interactive birthday greeting card with animations, confetti, and music." />
  <title>🎂 Happy Birthday Samvarsha!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
      --font-voice: 'Playfair Display', Georgia, serif;
      --purple-deep: #3C3489;
      --purple-mid: #533AB7;
      --purple-soft: #7F77DD;
      --purple-glow: #AFA9EC;
      --text-primary: #2D2654;
      --card-border: rgba(175, 169, 236, 0.5);
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }

    @keyframes confetti-fall {
      0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(700px) rotate(720deg); opacity: 0; }
    }

    @keyframes pop {
      0% { transform: scale(0.8); opacity: 0; }
      60% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(1); }
    }

    @keyframes sparkle {
      0%, 100% { opacity: 0; transform: scale(0) rotate(0deg); }
      50% { opacity: 1; transform: scale(1) rotate(180deg); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes glow-pulse {
      0%, 100% { box-shadow: 0 0 20px rgba(83, 58, 183, 0.15); }
      50% { box-shadow: 0 0 35px rgba(83, 58, 183, 0.3); }
    }

    @keyframes gradient-shift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.3; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    @keyframes cake-glow {
      0%, 100% { filter: drop-shadow(0 0 8px rgba(250, 199, 117, 0.4)); }
      50% { filter: drop-shadow(0 0 20px rgba(250, 199, 117, 0.8)); }
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes celebrateShake {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-5deg); }
      75% { transform: rotate(5deg); }
    }

    @keyframes shimmer {
      0% { background-position: -200% center; }
      100% { background-position: 200% center; }
    }

    @keyframes borderGlow {
      0%, 100% { border-color: rgba(175, 169, 236, 0.4); }
      50% { border-color: rgba(83, 58, 183, 0.6); }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a1333 0%, #2d1f5e 30%, #3a2673 50%, #2d1f5e 70%, #1a1333 100%);
      background-size: 400% 400%;
      animation: gradient-shift 15s ease infinite;
      padding: 1.5rem;
      position: relative;
      overflow-x: hidden;
    }

    .bg-star {
      position: fixed;
      color: rgba(255, 255, 255, 0.15);
      font-size: 12px;
      pointer-events: none;
      animation: twinkle ease-in-out infinite;
      z-index: 0;
    }

    .bday-wrap {
      max-width: 580px;
      width: 100%;
      background: linear-gradient(160deg, #fbeaf0 0%, #eeedfe 35%, #e1f5ee 65%, #fef9e7 100%);
      border-radius: 24px;
      padding: 2.5rem 2rem 2rem;
      text-align: center;
      position: relative;
      overflow: hidden;
      box-shadow:
        0 25px 60px rgba(0, 0, 0, 0.3),
        0 0 0 1px rgba(255, 255, 255, 0.1),
        inset 0 1px 0 rgba(255, 255, 255, 0.6);
      animation: glow-pulse 4s ease-in-out infinite, slideUp 0.8s ease-out;
      z-index: 1;
    }

    .bday-wrap::before,
    .bday-wrap::after {
      content: '';
      position: absolute;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      opacity: 0.08;
      pointer-events: none;
    }

    .bday-wrap::before {
      top: -40px;
      left: -40px;
      background: radial-gradient(circle, var(--purple-mid), transparent);
    }

    .bday-wrap::after {
      bottom: -40px;
      right: -40px;
      background: radial-gradient(circle, #9FE1CB, transparent);
    }

    .confetti-piece {
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 2px;
      animation: confetti-fall linear infinite;
      pointer-events: none;
      z-index: 10;
    }

    .cake {
      font-size: 80px;
      animation: float 3s ease-in-out infinite, cake-glow 2s ease-in-out infinite;
      display: inline-block;
      margin-bottom: 0.5rem;
      cursor: default;
      transition: transform 0.3s ease;
    }

    .cake:hover {
      transform: scale(1.15) rotate(-5deg);
      animation-play-state: paused;
    }

    .balloon {
      font-size: 40px;
      animation: float 2.5s ease-in-out infinite;
      display: inline-block;
      transition: transform 0.3s ease;
      cursor: default;
    }

    .balloon:nth-child(2) { animation-delay: 0.4s; }
    .balloon:nth-child(3) { animation-delay: 0.8s; }

    .balloon:hover {
      transform: scale(1.3) translateY(-8px);
    }

    .balloons {
      margin-bottom: 0.5rem;
    }

    .title {
      font-family: var(--font-voice);
      font-size: 32px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--purple-deep), var(--purple-mid), #9F5AB7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.15rem;
      animation: pop 0.6s ease;
      letter-spacing: -0.5px;
    }

    .title-name {
      font-family: var(--font-voice);
      font-size: 38px;
      font-weight: 700;
      background: linear-gradient(135deg, #D4438C, #9F5AB7, var(--purple-mid));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.3rem;
      animation: pop 0.6s ease 0.15s both;
      letter-spacing: -0.5px;
    }

    .subtitle {
      font-size: 14px;
      color: var(--purple-soft);
      margin-bottom: 1.4rem;
      font-weight: 400;
    }

    /* ─── Photo Gallery ────────────────────────────────────────── */
    .gallery-section {
      margin: 0.5rem auto 1.2rem;
      width: 100%;
      animation: fadeIn 0.8s ease 0.3s both;
    }

    .gallery-duo {
      display: flex;
      gap: 12px;
      align-items: stretch;
    }

    .gallery-photo-card {
      flex: 1;
      position: relative;
      border-radius: 18px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(12px);
      border: 2px solid var(--card-border);
      box-shadow: 0 12px 35px rgba(83, 58, 183, 0.12);
      animation: borderGlow 3s ease-in-out infinite;
      cursor: zoom-in;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .gallery-photo-card:hover {
      transform: translateY(-4px) scale(1.02);
      box-shadow: 0 20px 50px rgba(83, 58, 183, 0.2);
    }

    .gallery-photo-card img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      min-height: 320px;
      max-height: 480px;
      background: linear-gradient(135deg, #f8f6ff, #fef0f5);
    }

    .gallery-label {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 1.5rem 1rem 0.8rem;
      background: linear-gradient(to top, rgba(45, 31, 94, 0.85) 0%, rgba(45, 31, 94, 0.4) 60%, transparent 100%);
      color: #fff;
      text-align: left;
    }

    .gallery-label-title {
      font-family: var(--font-voice);
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 2px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.3);
    }

    .gallery-label-sub {
      font-size: 11px;
      opacity: 0.85;
      font-weight: 400;
    }

    @media (max-width: 480px) {
      .gallery-duo {
        flex-direction: column;
      }
      .gallery-photo-card img {
        min-height: 240px;
        max-height: 360px;
      }
    }

    /* ─── Fullscreen Modal ─────────────────────────────────────── */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(10, 5, 30, 0.92);
      backdrop-filter: blur(15px);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: zoom-out;
      animation: fadeIn 0.3s ease;
    }

    .lightbox.open {
      display: flex;
    }

    .lightbox img {
      max-width: 92vw;
      max-height: 90vh;
      object-fit: contain;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      cursor: default;
    }

    .lightbox-close {
      position: absolute;
      top: 20px;
      right: 24px;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }

    .lightbox-close:hover {
      background: rgba(255,255,255,0.25);
      transform: scale(1.1);
    }

    .lightbox-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.1);
      color: #fff;
      font-size: 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }

    .lightbox-nav:hover {
      background: rgba(255,255,255,0.2);
      transform: translateY(-50%) scale(1.1);
    }

    .lightbox-nav.lb-prev { left: 20px; }
    .lightbox-nav.lb-next { right: 20px; }

    .music-toggle {
      position: absolute;
      top: 16px;
      right: 18px;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(175, 169, 236, 0.4);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 500;
      color: var(--purple-mid);
      cursor: pointer;
      font-family: var(--font-sans);
      transition: all 0.3s ease;
      z-index: 5;
    }

    .music-toggle:hover {
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 2px 10px rgba(83, 58, 183, 0.15);
    }

    .music-toggle.active {
      background: linear-gradient(135deg, var(--purple-mid), #6B4FCF);
      color: #fff;
      border-color: transparent;
    }

    /* Footer */
    .footer {
      margin-top: 1.5rem;
      font-size: 11px;
      color: rgba(127, 119, 221, 0.5);
      letter-spacing: 0.5px;
    }

    /* Responsive */
    @media (max-width: 480px) {
      body { padding: 0.8rem; }

      .bday-wrap {
        padding: 2rem 1rem 1.5rem;
        border-radius: 20px;
      }

      .title { font-size: 26px; }
      .title-name { font-size: 30px; }
      .cake { font-size: 64px; }
      .balloon { font-size: 32px; }

      .gallery-slide img {
        max-height: 400px;
      }

      .gallery-nav {
        width: 34px;
        height: 34px;
        font-size: 15px;
      }

      .gallery-nav.prev { left: 8px; }
      .gallery-nav.next { right: 8px; }

      .gallery-label-title { font-size: 15px; }
    }
  </style>
</head>
<body>
  <!-- Hidden YouTube player for background music -->
  <div id="ytPlayer" style="position:fixed;top:-9999px;left:-9999px;width:1px;height:1px;pointer-events:none;"></div>

  <!-- Lightbox for full-screen view -->
  <div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
    <button class="lightbox-close" onclick="closeLightbox(event)">✕</button>
    <img id="lightboxImg" src="" alt="Full view" />
  </div>

  <div class="bday-wrap" id="bwrap">
    <button class="music-toggle" id="musicBtn" onclick="toggleMusic()">🎵 Music</button>

    <div id="confettiContainer"></div>

    <div class="balloons">
      <span class="balloon">🎈</span>
      <span class="balloon">🎀</span>
      <span class="balloon">🎈</span>
    </div>

    <div class="cake" id="mainCake">🎂</div>

    <h1 class="title">Love you</h1>
    <div class="title-name">Lekhya! 💜</div>
    <p class="subtitle">Click the photo to zoom ✨</p>

    <!-- Photos side by side -->
    <div class="gallery-section">
      <div class="gallery-duo">

        <!-- Image 1: Gajju Bomma Collage -->
        <div class="gallery-photo-card" onclick="openLightbox('images/gajju-collage.png')">
          <img
            src="images/gajju-collage.png"
            alt="Love You Gajju Bomma — photo collage"
          />
          <div class="gallery-label">
            <div class="gallery-label-title">💜 Love You Gajju Bomma</div>
            <div class="gallery-label-sub">Always & Forever 🦋</div>
          </div>
        </div>

        <!-- Image 2: Dear Gajju Bomma Letter -->
        <div class="gallery-photo-card" onclick="openLightbox('images/gajju-letter.jpg')">
          <img
            src="images/gajju-letter.jpg"
            alt="Dear Gajju Bomma — heartfelt letter"
          />
          <div class="gallery-label">
            <div class="gallery-label-title">💌 Dear Gajju Bomma</div>
            <div class="gallery-label-sub">From Buddiii 🩷</div>
          </div>
        </div>

      </div>
    </div>


    <div class="footer">Made with 💜 love by Buddii</div>
  </div>

  <script>
    // ─── Lightbox ──────────────────────────────────────────────────
    function openLightbox(src) {
      const lb = document.getElementById('lightbox');
      document.getElementById('lightboxImg').src = src;
      lb.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox(e) {
      if (e.target.tagName === 'IMG') return;
      const lb = document.getElementById('lightbox');
      lb.classList.remove('open');
      document.body.style.overflow = '';
    }

    // Close lightbox on Escape
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        const lb = document.getElementById('lightbox');
        lb.classList.remove('open');
        document.body.style.overflow = '';
      }
    });

    // ─── Background Stars ──────────────────────────────────────────
    function createBackgroundStars() {
      const stars = ['✦', '✧', '⋆', '·', '°'];
      for (let i = 0; i < 30; i++) {
        const star = document.createElement('div');
        star.className = 'bg-star';
        star.textContent = stars[Math.floor(Math.random() * stars.length)];
        star.style.left = Math.random() * 100 + '%';
        star.style.top = Math.random() * 100 + '%';
        star.style.fontSize = (8 + Math.random() * 14) + 'px';
        star.style.animationDuration = (2 + Math.random() * 4) + 's';
        star.style.animationDelay = (Math.random() * 3) + 's';
        document.body.appendChild(star);
      }
    }

    // ─── Confetti ──────────────────────────────────────────────────
    const colors = ['#F4C0D1', '#CECBF6', '#9FE1CB', '#FAC775', '#B5D4F4', '#F0997B', '#C0DD97', '#FFB3D9', '#A7D8FF'];

    function launchConfetti() {
      const container = document.getElementById('confettiContainer');
      const shapes = ['50%', '2px', '0'];
      for (let i = 0; i < 32; i++) {
        const p = document.createElement('div');
        p.className = 'confetti-piece';
        p.style.left = Math.random() * 100 + '%';
        p.style.top = '-20px';
        p.style.background = colors[Math.floor(Math.random() * colors.length)];
        const size = 6 + Math.random() * 10;
        p.style.width = size + 'px';
        p.style.height = size + 'px';
        p.style.borderRadius = shapes[Math.floor(Math.random() * shapes.length)];
        p.style.animationDuration = (2 + Math.random() * 2.5) + 's';
        p.style.animationDelay = (Math.random() * 1) + 's';
        p.style.opacity = (0.7 + Math.random() * 0.3).toString();
        container.appendChild(p);
        setTimeout(() => p.remove(), 4500);
      }
    }

    // ─── Music (YouTube Background Audio) ───────────────────────────
    let musicPlaying = false;
    let ytPlayer = null;
    let ytReady = false;

    // Load YouTube IFrame API
    const ytScript = document.createElement('script');
    ytScript.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(ytScript);

    function onYouTubeIframeAPIReady() {
      ytPlayer = new YT.Player('ytPlayer', {
        height: '0',
        width: '0',
        videoId: 'Xr0_IWl87HY',
        playerVars: {
          autoplay: 0,
          loop: 1,
          playlist: 'Xr0_IWl87HY', // Required for loop to work
          controls: 0,
          disablekb: 1,
          fs: 0,
          modestbranding: 1,
          rel: 0,
        },
        events: {
          onReady: function () {
            ytReady = true;
            ytPlayer.setVolume(80);
          },
          onStateChange: function (e) {
            // If video ends and loop didn't trigger, replay
            if (e.data === YT.PlayerState.ENDED) {
              ytPlayer.seekTo(0);
              ytPlayer.playVideo();
            }
          },
        },
      });
    }

    function toggleMusic() {
      const btn = document.getElementById('musicBtn');

      if (musicPlaying) {
        musicPlaying = false;
        btn.textContent = '🎵 Music';
        btn.classList.remove('active');
        if (ytReady) ytPlayer.pauseVideo();
        return;
      }

      musicPlaying = true;
      btn.textContent = '🔇 Stop';
      btn.classList.add('active');

      if (ytReady) {
        ytPlayer.playVideo();
      } else {
        // If API isn't ready yet, retry after a short delay
        const retryInterval = setInterval(() => {
          if (ytReady) {
            ytPlayer.playVideo();
            clearInterval(retryInterval);
          }
        }, 300);
        // Give up after 10 seconds
        setTimeout(() => clearInterval(retryInterval), 10000);
      }
    }

    // ─── Init ──────────────────────────────────────────────────────
    createBackgroundStars();
    setTimeout(launchConfetti, 500);
  </script>
</body>
</html>
